name: bot de papel

on:
  # CRON DESACTIVADO. Los runners de GitHub estan en Azure US y tanto Bybit
  # (HTTP 403, CloudFront geo-bloqueo) como Binance (HTTP 451) rechazan esas
  # IP. Ver diagnostico_resultado.txt. La estrategia solo tiene senal
  # explotable en esos dos exchanges (Sharpe 5.3-6.6 frente a 1.1-1.6 en
  # Bitget, Gate.io y MEXC), asi que hace falta ejecutar desde fuera de EEUU.
  #
  # Para reactivarlo con un runner propio fuera de EEUU:
  #   1. descomentar el bloque schedule
  #   2. cambiar 'runs-on: ubuntu-latest' por 'runs-on: self-hosted'
  #
  # schedule:
  #   - cron: "0 * * * *"
  workflow_dispatch:        # se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: paper-bot          # nunca dos ejecuciones a la vez
  cancel-in-progress: false

jobs:
  paso:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: ejecutar un ciclo
        run: python bot.py step

      - name: actualizar README
        run: python bot.py readme

      - name: verificar integridad de la cadena
        run: python bot.py verificar

      - name: guardar el estado en el repositorio
        run: |
          git config user.name  "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add papel/ README.md
          if git diff --staged --quiet; then
            echo "sin cambios"
          else
            git commit -m "paso $(date -u +'%Y-%m-%dT%H:%MZ')"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              echo "reintento $i"; sleep 5
            done
          fi
