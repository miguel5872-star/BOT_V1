name: diagnostico de conectividad

on:
  push:
    paths:
      - "diagnostico.py"
      - ".github/workflows/diagnostico.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: que exchanges responden desde aqui
        run: python diagnostico.py 2>&1 | tee diagnostico_resultado.txt

      - name: guardar el resultado en el repositorio
        if: always()
        run: |
          git config user.name  "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add diagnostico_resultado.txt
          if git diff --staged --quiet; then
            echo "sin cambios"
          else
            git commit -m "resultado del diagnostico $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase --autostash && git push
          fi
